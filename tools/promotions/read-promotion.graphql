query ReadPromotion($parentId: ID!) {
  product(id: $parentId) {
    id title
    variants(first: 1) { nodes { price compareAtPrice } }
  }
  collections(first: 5, query: "handle:olo-brush-promotion") {
    nodes {
      id title handle
      badge: metafield(namespace: "custom", key: "promotion_badge") { value }
      enabled: metafield(namespace: "custom", key: "promotion_enabled") { value }
      products(first: 20) { nodes { id title } }
    }
  }
  metafieldDefinitions(first: 30, ownerType: COLLECTION, namespace: "custom") {
    nodes { id namespace key type { name } }
  }
}
