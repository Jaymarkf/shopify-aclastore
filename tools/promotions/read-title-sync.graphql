query ReadDiscountTitleSync($discountId: ID!, $collectionId: ID!) {
  discountNode(id: $discountId) {
    discount {
      ... on DiscountAutomaticBasic {
        title status startsAt endsAt
        customerGets { items { ... on DiscountCollections { collections(first: 100) { nodes { id } } } } }
      }
    }
  }
  collection(id: $collectionId) {
    id
    titleCopy: metafield(namespace: "custom", key: "promotion_badge") { value }
    activeCopy: metafield(namespace: "custom", key: "promotion_enabled") { value }
  }
}
