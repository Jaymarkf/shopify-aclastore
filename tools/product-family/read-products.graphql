query FamilySetup($after: String) {
  products(first: 250, after: $after, query: "title:OLO*") {
    nodes {
      id
      title
      handle
      status
      vendor
      descriptionHtml
      onlineStoreUrl
      variants(first: 2) {
        nodes {
          id
          title
          sku
          price
          compareAtPrice
          availableForSale
          inventoryPolicy
        }
      }
      familyProducts: metafield(namespace: "custom", key: "family_products") { type value }
      swatchColor: metafield(namespace: "custom", key: "swatch_color") { type value }
    }
    pageInfo { hasNextPage endCursor }
  }
  parent: products(first: 5, query: "handle:olo-premium-markers-brush") {
    nodes {
      id title handle templateSuffix status
      variants(first: 1) { nodes { id price } }
      familyProducts: metafield(namespace: "custom", key: "family_products") { type value }
    }
  }
  metafieldDefinitions(first: 20, ownerType: PRODUCT, namespace: "custom") {
    nodes { id name namespace key type { name } }
  }
  publications(first: 20) { nodes { id name } }
}
